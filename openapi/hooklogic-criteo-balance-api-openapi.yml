        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 25
      - name: limit-to-id
        in: query
        description: The balance ids which the result is limited to.
        schema:
          maxItems: 50
          type: array
          items:
            type: string
      - name: offset
        in: query
        description: The (zero-based) starting offset in the collection.
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResourceCollectionOutcomeBalanceV1AndMetadata'
      security:
      - oauth:
