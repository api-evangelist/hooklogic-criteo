    RmContactListStatisticsEntityV1Resource:
      type:
      - object
      - 'null'
      properties:
        attributes:
          $ref: '#/components/schemas/RmContactListStatisticsEntityV1'
        id:
          type:
          - string
          - 'null'
          description: Id of the entity
        type:
          type:
          - string
          - 'null'
      description: A class that represents a domain entity exposed by an API
    RmAlgebraNodeV1:
