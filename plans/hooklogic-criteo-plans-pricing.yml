note: >-
  Criteo publishes NO plans, tiers or list prices for the Retail Media API (the
  HookLogic product line). There is no pricing page on criteo.com — both
  /pricing and /pricing/ return 404 — and the developer portal frames access by
  PARTY TYPE rather than by plan: brands and agencies build with the API under
  their existing Criteo advertising relationship, retailers are told to "reach
  out to your Criteo representative", and marketplaces are onboarded through
  Private Market. API access itself is not sold as a metered product; the money
  changes hands as retail-media ad spend, billed through the Balance and Billing
  endpoints, at rates negotiated per contract. Access to the API requires a
  partner account plus explicit advertiser consent, so nothing here is
  self-serve priced.
