aid: hooklogic-criteo
name: HookLogic (Criteo)
description: >-
  HookLogic was a retail-media advertising exchange and ad server that let brands
  buy sponsored-product placements in retailer search results (Walmart, Target,
  Best Buy). Criteo acquired HookLogic for ~$250M in 2016, and the product line
  is now delivered as the Criteo Retail Media API — a REST API for retailers,
  brands, and agencies to programmatically create, launch, monitor, and report on
  retail-media campaigns. It uses OAuth 2.0 (client-credentials and
  authorization-code flows), RFC 7807 error bodies, date-based API versioning,
  and ships officially supported Python, PHP, and Java SDKs.
